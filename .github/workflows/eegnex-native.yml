name: EEGNeX complete reference

on:
  pull_request:
    paths:
      - 'torcheeg/models/cnn/eegnex.py'
      - 'torcheeg/models/cnn/__init__.py'
      - 'test/models/test_eegnex*.py'
      - 'test/examples/test_bciciv2a_eegnex.py'
      - 'examples/examples_bciciv2a_eegnex.py'
      - 'docs/source/user_guide/eegnex.rst'
      - '.github/workflows/eegnex-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eegnex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_EEGNEX_REFERENCE: external-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: braindecode/braindecode
          ref: 3a2c4c28e7c7bda470cf3ad06534badd5f5bb119
          path: external-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching CPU dependencies and the complete reference
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          echo 'torch==2.6.0' > native-constraints.txt
          echo 'torchaudio==2.6.0' >> native-constraints.txt
          python -m pip install -e '.[model,dataset]' -e ./external-reference -c native-constraints.txt
      - name: Compare all reference parameters, gradients and updates; run example
        run: |
          python -m unittest test.models.test_eegnex test.models.test_eegnex_native test.examples.test_bciciv2a_eegnex
