name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'test/utils/test_leaderboard.*'
      - 'examples/**'
      - 'torcheeg/**'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'AGENTS.md'
      - '.agents/**'
      - 'llms.txt'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            setup.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate leaderboard data and filtering
        run: |
          python docs/validate_leaderboard.py
          node --test test/utils/test_leaderboard.js
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt .
          python -m pip check
      - name: Build documentation with warnings as errors
        run: python -m sphinx -b html -W --keep-going docs/source build/docs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: build/docs
