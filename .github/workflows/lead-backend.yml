name: LEAD external backend

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/lead.py'
      - 'test/models/test_lead*.py'
      - 'examples/examples_eegmat_lead.py'
      - 'docs/source/user_guide/lead.rst'
      - '.github/workflows/lead-backend.yml'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_LEAD_BACKEND_ROOT: ${{ github.workspace }}/external/lead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DL4mHealth/LEAD
          ref: c7e21e112a3965b09604b2098e93095880a940dd
          path: external/lead
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: setup.py
      - name: Install CPU runtime and integration dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[foundation,dataset]' 'huggingface_hub>=0.28,<2' matplotlib
      - name: Cache pinned official checkpoint
        uses: actions/cache@v4
        with:
          path: external/lead-weights
          key: lead-p-base-3232e93b5a67a7f3141b16b5ae70b09ae94e65163ccff79755119fbfa598c8db
      - name: Obtain separately licensed official checkpoint
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          filename = 'checkpoints/LEAD/pretrain/LEAD/P-11-b1024-p50-g16-learnable-3D/nh8_el12_dm128_df256_seed41/checkpoint.pth'
          path = Path(hf_hub_download('YiheWang/LEAD', filename,
              revision='8ac42d5a595a3c080c36a6f84932ac1ba10ee857', local_dir='external/lead-weights')).resolve()
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '3232e93b5a67a7f3141b16b5ae70b09ae94e65163ccff79755119fbfa598c8db'
          hf_hub_download('YiheWang/LEAD', 'README.md',
              revision='8ac42d5a595a3c080c36a6f84932ac1ba10ee857', local_dir='external/lead-weights')
          shutil.copyfile('LICENSES/LEAD-BACKEND-NOTICE.txt', 'external/lead-weights/LEAD-BACKEND-NOTICE.txt')
          shutil.copyfile(Path(os.environ['TORCHEEG_LEAD_BACKEND_ROOT']) / 'LICENSE', 'external/lead-weights/SOURCE_LICENSE')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('TORCHEEG_LEAD_CHECKPOINT=' + str(path) + '\n')
          PY
      - name: Validate complete native model and adapter
        run: python -m unittest test.models.test_lead_native
