name: YASA complete pretrained reference

on:
  pull_request:
    paths:
      - 'torcheeg/models/traditional/**'
      - 'torcheeg/models/__init__.py'
      - 'test/models/test_yasa.py'
      - 'test/models/_optional_yasa.py'
      - 'test/examples/test_sleepedf_yasa.py'
      - 'examples/examples_sleepedf_yasa.py'
      - 'docs/source/user_guide/yasa.rst'
      - 'setup.py'
      - '.github/workflows/yasa-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yasa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install separate optional runtime and exact official pretrained backend
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          echo 'torch==2.6.0' > native-constraints.txt
          echo 'torchaudio==2.6.0' >> native-constraints.txt
          echo 'numpy==2.2.6' >> native-constraints.txt
          python -m pip install -e '.[model,dataset,yasa]' -c native-constraints.txt
      - name: Compare all eight full classifiers and independent physical example
        run: |
          python -c "from test.models._optional_yasa import matching_yasa_available; assert matching_yasa_available()"
          python -m unittest test.models.test_yasa test.examples.test_sleepedf_yasa
