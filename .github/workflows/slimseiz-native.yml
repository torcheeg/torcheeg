name: SlimSeiz complete author network

on:
  pull_request:
    paths:
      - 'torcheeg/models/cnn/slimseiz.py'
      - 'torcheeg/models/cnn/__init__.py'
      - 'test/models/test_slimseiz*.py'
      - 'test/examples/test_bciciv2a_slimseiz.py'
      - 'examples/examples_bciciv2a_slimseiz.py'
      - 'docs/source/user_guide/slimseiz.rst'
      - '.github/workflows/slimseiz-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slimseiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_SLIMSEIZ_SOURCE: external/Loop_ADDNet_kFold.ipynb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Obtain and hash the complete separate author file
        run: |
          mkdir external
          curl --fail --location --retry 3 https://raw.githubusercontent.com/guoruilu/SlimSeiz/84b168278173a0e14163a6839fb36d7c41bc3c52/Loop_ADDNet_kFold.ipynb --output external/Loop_ADDNet_kFold.ipynb
          echo 'a77807eee44b3a95780c12f656091172467dd7f967be942061d6cf417921d2a9  external/Loop_ADDNet_kFold.ipynb' | sha256sum --check
      - name: Install matching CPU dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          python -m pip install -e '.[model,dataset]'
      - name: Compare the full original network and independent workflow
        run: |
          python -m unittest test.models.test_slimseiz test.models.test_slimseiz_native test.examples.test_bciciv2a_slimseiz
