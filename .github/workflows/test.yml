name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            torch-version: '2.4.1'
            torchvision-version: '0.19.1'
            pyg-torch-version: '2.4.0'
          - python-version: '3.10'
            torch-version: '2.6.0'
            torchvision-version: '0.21.0'
            pyg-torch-version: '2.6.0'
          - python-version: '3.12'
            torch-version: '2.6.0'
            torchvision-version: '0.21.0'
            pyg-torch-version: '2.6.0'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      TORCH_VERSION: ${{ matrix.torch-version }}
      TORCHVISION_VERSION: ${{ matrix.torchvision-version }}
      PYG_TORCH_VERSION: ${{ matrix.pyg-torch-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTorch and graph extensions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==$TORCH_VERSION" "torchvision==$TORCHVISION_VERSION" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=torch-scatter,torch-sparse torch-scatter==2.1.2 torch-sparse==0.6.18 --find-links "https://data.pyg.org/whl/torch-${PYG_TORCH_VERSION}+cpu.html"
      - name: Install package and dependencies
        run: |
          printf '%s\n' "torch==$TORCH_VERSION" "torchvision==$TORCHVISION_VERSION" 'torch-scatter==2.1.2' 'torch-sparse==0.6.18' 'lmdb==1.4.1' > constraints.txt
          python -m pip install -e '.[test,model,trainer,transforms,dataset]' -c constraints.txt
      - name: Install coverage tooling
        if: matrix.python-version == '3.10'
        run: python -m pip install coverage==7.16.2
      - name: Run tests
        if: matrix.python-version != '3.10'
        run: python -m unittest discover -s test -t .
      - name: Run tests with branch and process coverage
        if: matrix.python-version == '3.10'
        run: python -m coverage run -m unittest discover -s test -t .
      - name: Combine coverage
        if: always() && matrix.python-version == '3.10'
        run: python -m coverage combine
      - name: Generate coverage reports and enforce threshold
        if: always() && matrix.python-version == '3.10'
        run: |
          python -m coverage html --fail-under=0
          python -m coverage xml --fail-under=0
          python -m coverage json --fail-under=0
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
      - name: Upload coverage reports
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.10
          path: |
            htmlcov/
            coverage.xml
            coverage.json
          if-no-files-found: error

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          wheel_python="$RUNNER_TEMP/wheel-env/bin/python"
          "$wheel_python" -m pip install --upgrade pip
          "$wheel_python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          echo 'torch==2.6.0' > "$RUNNER_TEMP/wheel-constraints.txt"
          "$wheel_python" -m pip install dist/*.whl -c "$RUNNER_TEMP/wheel-constraints.txt"
          "$wheel_python" -m pip check
      - name: Check installed imports and model execution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          import numpy as np
          import torch
          import torcheeg
          from torcheeg import model_selection, transforms
          from torcheeg.datasets import DEAPDataset
          from torcheeg.io import LMDBEEGIO
          from torcheeg.models import EEGNet
          from torcheeg.trainers import ClassifierTrainer
          from torcheeg.visualizers import plot_2d_tensor

          assert Path(torcheeg.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          with tempfile.TemporaryDirectory() as path:
              store = LMDBEEGIO(path)
              sample = np.zeros((32, 128))
              store.write_eeg(sample, key='sample')
              np.testing.assert_array_equal(store.read_eeg('sample'), sample)
              del store
          model = EEGNet(num_electrodes=32, chunk_size=128, num_classes=2)
          model.eval()
          with torch.no_grad():
              assert model(torch.zeros(2, 1, 32, 128)).shape == (2, 2)
          print('Installed wheel imports, LMDB IO and EEGNet execution passed.')
          PY
