name: SleepEEGNet complete TensorFlow 1 reference

on:
  pull_request:
    paths:
      - 'torcheeg/models/rnn/sleepeegnet.py'
      - 'torcheeg/models/rnn/__init__.py'
      - 'test/models/test_sleepeegnet*.py'
      - 'test/models/_sleepeegnet_fixture.py'
      - 'test/examples/test_sleepedf_sleepeegnet.py'
      - 'examples/examples_sleepedf_sleepeegnet.py'
      - 'docs/source/user_guide/sleepeegnet.rst'
      - '.github/workflows/sleepeegnet-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sleepeegnet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_SLEEPEEGNET_FIXTURES: native-sleepeegnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: MousaviSajad/SleepEEGNet
          ref: 288ee50700ef34780c6e056a884cf22308aa6de2
          path: external-reference
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          activate-environment: legacy-tf1
          python-version: '3.7'
          channels: conda-forge
          conda-remove-defaults: true
      - name: Generate complete unchanged author NN oracle in its native runtime
        shell: bash -el {0}
        run: |
          python -m pip install 'pip<24.1'
          python -m pip install tensorflow==1.15.5 numpy==1.18.5 protobuf==3.20.3 h5py==2.10.0
          python test/models/_sleepeegnet_fixture.py --source external-reference/seq2seq_sleep_sleep-EDF.py --output-dir native-sleepeegnet
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install separate current CPU TorchEEG validation runtime
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          echo 'torch==2.6.0' > native-constraints.txt
          echo 'torchaudio==2.6.0' >> native-constraints.txt
          python -m pip install -e '.[model,dataset]' -c native-constraints.txt
      - name: Compare complete author outputs, losses, gradients and SGD and run example
        run: |
          python -m unittest test.models.test_sleepeegnet test.models.test_sleepeegnet_native test.examples.test_sleepedf_sleepeegnet
