name: mdJPT external backend

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/mdjpt.py'
      - 'test/models/test_mdjpt*.py'
      - 'test/models/fixtures/mdjpt_state_geometry.json'
      - 'examples/examples_eegmat_mdjpt.py'
      - 'docs/source/user_guide/mdjpt.rst'
      - '.github/workflows/mdjpt-backend.yml'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_MDJPT_BACKEND_ROOT: ${{ github.workspace }}/external/mdjpt
      TORCHEEG_MDJPT_CHECKPOINT: ${{ github.workspace }}/external/mdjpt/log/pretrain/ckpt/epoch=19.ckpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ncclab-sustech/mdJPT_nips2025
          ref: bb84e89df5d05928ef3aa8645cbc339b59ed59de
          path: external/mdjpt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: setup.py
      - name: Install CPU runtime and explicit author dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          python -m pip install -e '.[foundation,model,dataset]' omegaconf==2.3.0 timm matplotlib
      - name: Verify complete author checkpoint and physical neighbor table
        run: |
          python - <<'PY2'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['TORCHEEG_MDJPT_BACKEND_ROOT'])
          checkpoint = Path(os.environ['TORCHEEG_MDJPT_CHECKPOINT'])
          assert checkpoint.stat().st_size == 6453928
          assert hashlib.sha256(checkpoint.read_bytes()).hexdigest() == '9a8da20e6ca4b4709251c13e16c88a155d3fa6a9b1a8411a37f019d6440e98b9'
          assert hashlib.sha256((root / 'channel_interpolate.npy').read_bytes()).hexdigest() == 'bc083c8b44d984b627d265a7ef500a9953347dfcfc7995184de0217581c6b8e2'
          PY2
      - name: Compare complete neural source and every gradient with explicit CPU allocation port
        run: python -m unittest test.models.test_mdjpt test.models.test_mdjpt_example test.models.test_mdjpt_native
