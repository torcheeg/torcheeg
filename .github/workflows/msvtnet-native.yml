name: MSVTNet original model

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/msvtnet.py'
      - 'torcheeg/models/transformer/__init__.py'
      - 'test/models/test_msvtnet*.py'
      - 'test/examples/test_bciciv2a_msvtnet.py'
      - 'examples/examples_bciciv2a_msvtnet.py'
      - 'docs/source/user_guide/msvtnet.rst'
      - '.github/workflows/msvtnet-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_MSVTNET_SOURCE: external/MSVTNet.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain and verify the original author model
        run: |
          mkdir external
          curl --fail --location --retry 3 https://raw.githubusercontent.com/SheepTAO/MSVTNet/c3fa7fd7e0acc13ebf85352fe583dd4e14f85d34/MSVTNet.py --output external/MSVTNet.py
          echo '115a7f4ad1bb1bb7862198c13a1aee86463bc9bdd1ad9bb069881fddda8d549e  external/MSVTNet.py' | sha256sum --check
      - name: Install matching CPU dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          python -m pip install -e '.[model,dataset]'
      - name: Compare the complete original model and run the independent example
        run: |
          python -m unittest test.models.test_msvtnet test.models.test_msvtnet_native test.examples.test_bciciv2a_msvtnet
