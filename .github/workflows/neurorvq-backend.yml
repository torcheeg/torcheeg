name: NeuroRVQ external backend

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/neurorvq*.py'
      - 'test/models/test_neurorvq*.py'
      - 'examples/examples_eegmat_neurorvq*.py'
      - 'docs/source/user_guide/neurorvq.rst'
      - '.github/workflows/neurorvq-backend.yml'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_NEURORVQ_BACKEND_ROOT: ${{ github.workspace }}/external/neurorvq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KonstantinosBarmpas/NeuroRVQ
          ref: 27c3c134a53cc29c0d1696ebfe65f3e17ea9ab0c
          path: external/neurorvq
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: setup.py
      - name: Install CPU runtime and integration dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          python -m pip install -e '.[foundation,model,dataset]' 'huggingface_hub>=0.28,<2' matplotlib
      - name: Cache pinned official checkpoint
        uses: actions/cache@v4
        with:
          path: external/neurorvq-weights
          key: neurorvq-complete-tokenizer-d3e850e1-base-d14ef4eae2d4594d5f1f709226a3bb5f362afd84b68050d5da0fa0586aea886a
      - name: Obtain separately licensed official checkpoint
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          filename = 'pretrained_models/foundation_models/NeuroRVQ_EEG_foundation_model_v1.pt'
          path = Path(hf_hub_download('ntinosbarmpas/NeuroRVQ', filename,
              revision='d944b87f44ae0ba2923b2f10d0518f23f6803b76', local_dir='external/neurorvq-weights')).resolve()
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'd14ef4eae2d4594d5f1f709226a3bb5f362afd84b68050d5da0fa0586aea886a'
          tokenizer = Path(hf_hub_download('ntinosbarmpas/NeuroRVQ',
              'pretrained_models/tokenizers/NeuroRVQ_EEG_tokenizer_v1.pt',
              revision='d944b87f44ae0ba2923b2f10d0518f23f6803b76', local_dir='external/neurorvq-weights')).resolve()
          assert hashlib.sha256(tokenizer.read_bytes()).hexdigest() == 'd3e850e160b1a558c529466b1c0b8cebe8888a5e02824979886dd226187b2725'
          hf_hub_download('ntinosbarmpas/NeuroRVQ', 'LICENSE',
              revision='d944b87f44ae0ba2923b2f10d0518f23f6803b76', local_dir='external/neurorvq-weights')
          shutil.copyfile('LICENSES/NEURORVQ-BACKEND-NOTICE.txt', 'external/neurorvq-weights/NEURORVQ-BACKEND-NOTICE.txt')
          shutil.copyfile(Path(os.environ['TORCHEEG_NEURORVQ_BACKEND_ROOT']) / 'LICENSE', 'external/neurorvq-weights/SOURCE_LICENSE')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('TORCHEEG_NEURORVQ_CHECKPOINT=' + str(path) + '\n')
              stream.write('TORCHEEG_NEURORVQ_TOKENIZER_CHECKPOINT=' + str(tokenizer) + '\n')
          PY
      - name: Validate complete native model and adapter
        run: python -m unittest test.models.test_neurorvq_native test.models.test_neurorvq_tokenizer_native
