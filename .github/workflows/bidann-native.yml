name: BiDANN complete LibEER reference

on:
  pull_request:
    paths:
      - 'torcheeg/models/rnn/bidann.py'
      - 'torcheeg/models/rnn/__init__.py'
      - 'test/models/test_bidann*.py'
      - 'test/examples/test_seed_bidann.py'
      - 'examples/examples_seed_bidann.py'
      - 'docs/source/user_guide/bidann.rst'
      - '.github/workflows/bidann-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bidann:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_BIDANN_REFERENCE: external-reference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: XJTU-EEG/LibEER
          ref: dddff9776dbdae21195fe320dff0a5ba61628a18
          path: external-reference
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install matching CPU dependencies and the complete reference
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          echo 'torch==2.6.0' > native-constraints.txt
          echo 'torchaudio==2.6.0' >> native-constraints.txt
          python -m pip install -e '.[model,dataset]' -c native-constraints.txt
      - name: Compare every native parameter, gradient and update and run example
        run: |
          python -m unittest test.models.test_bidann test.models.test_bidann_native test.examples.test_seed_bidann
