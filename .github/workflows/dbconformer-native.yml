name: DBConformer complete author backend

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/dbconformer.py'
      - 'torcheeg/models/transformer/__init__.py'
      - 'test/models/test_dbconformer*.py'
      - 'test/examples/test_bciciv2a_dbconformer.py'
      - 'examples/examples_bciciv2a_dbconformer.py'
      - 'docs/source/user_guide/dbconformer.rst'
      - '.github/workflows/dbconformer-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbconformer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_DBCONFORMER_SOURCE: external/DBConformer.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain and hash the complete separate author file
        run: |
          mkdir external
          curl --fail --location --retry 3 https://raw.githubusercontent.com/wzwvv/DBConformer/02cf63206087045c5cd0e8fa882831102e6fd01b/models/DBConformer.py --output external/DBConformer.py
          echo 'b891d8ba28b3ef5064106065e4a2c9bd1e346fe29b6d68cc50c91dbf6cfa4bd1  external/DBConformer.py' | sha256sum --check
      - name: Install matching CPU dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          python -m pip install -e '.[model,dataset]' timm==1.0.10
      - name: Check the full original model and independent workflow
        run: |
          python -m unittest test.models.test_dbconformer test.models.test_dbconformer_native test.examples.test_bciciv2a_dbconformer
