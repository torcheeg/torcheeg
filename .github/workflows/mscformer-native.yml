name: MSCFormer complete reference

on:
  pull_request:
    paths:
      - 'torcheeg/models/transformer/mscformer.py'
      - 'torcheeg/models/transformer/__init__.py'
      - 'test/models/test_mscformer*.py'
      - 'test/examples/test_bciciv2a_mscformer.py'
      - 'examples/examples_bciciv2a_mscformer.py'
      - 'docs/source/user_guide/mscformer.rst'
      - '.github/workflows/mscformer-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mscformer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MPLBACKEND: Agg
      TORCHEEG_MSCFORMER_REFERENCE: external-reference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: braindecode/braindecode
          ref: 082492fb93a3aa4c5784dc44026642bbc82f49c3
          path: external-reference
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install matching CPU dependencies and the complete reference
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=:all: --find-links https://data.pyg.org/whl/torch-2.6.0+cpu.html
          echo 'torch==2.6.0' > native-constraints.txt
          echo 'torchaudio==2.6.0' >> native-constraints.txt
          python -m pip install -e '.[model,dataset]' -e ./external-reference -c native-constraints.txt
      - name: Compare every native parameter, gradient and update and run example
        run: |
          python -m unittest test.models.test_mscformer test.models.test_mscformer_native test.examples.test_bciciv2a_mscformer
