{% set version = "1.1.3" %}

package:
  name: torcheeg
  version: "{{ version }}"

source:
  path: .

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.7
    - pytorch
    - tqdm >=4.64.0
    - numpy >=1.21.5
    - pandas >=1.3.5
    - xlrd >=2.0.1
    - scipy >=1.7.3
    - scikit-learn >=1.0.2
    - python-lmdb >=1.3.0
    - einops >=0.4.1
    - mne-base >=1.0.3
    - xmltodict >=0.13.0
    - networkx >=2.6.3
    - pywavelets >=1.3.0
    - spectrum >=0.8.1
    - torchmetrics >=0.10.0
    - mne-connectivity >=0.4.0
    - pytorch-lightning
    - wfdb >=4.1.2
    - filelock >=3.0

test:
  imports:
    - torcheeg
    - torcheeg.datasets
    - torcheeg.models
    - torcheeg.transforms
  commands:
    - python -c "import torch; from torcheeg.models import EEGNet; model = EEGNet(num_electrodes=32); model.eval(); assert model(torch.randn(2, 1, 32, 128)).shape == (2, 2)"

about:
  home: https://github.com/torcheeg/torcheeg
  license: MIT
  license_file: LICENSE
  summary: 'TorchEEG is a library built on PyTorch for EEG signal analysis.'
